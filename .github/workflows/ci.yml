name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Regression suite (84 cases)
        run: python -m pytest

      - name: Public API surface coverage
        run: python -m eth_qa.api_coverage --tests tests --out reports

      - name: Quality gate (3 rounds, blocks on stable-fail)
        run: python -m eth_qa.quality --tests tests --runs 3 --out reports

      - name: Mutation testing (17 mutants)
        run: python -m eth_qa.mutation --tests tests --out reports

      # 门禁自检：反例套件必须被判红。若它反而通过，说明门禁失效。
      - name: Gate must block the negative demo
        run: |
          if python -m eth_qa.quality --tests demo_defect --runs 3 --out reports-demo; then
            echo "::error::demo_defect passed the gate - the gate is broken"
            exit 1
          else
            echo "OK: gate correctly blocked a failing suite"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            reports/
            reports-demo/
          if-no-files-found: warn
